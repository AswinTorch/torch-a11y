<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>torch-a11y</title>
    <meta
      name="description"
      content="A small accessibility panel for your site. Text size, contrast, motion, links and a readable font, applied before the first paint."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='12' fill='%23111'/%3E%3Ccircle cx='12' cy='6' r='1.6' fill='%23fff'/%3E%3Cpath d='M6.5 9.25c1.8.5 3.6.75 5.5.75s3.7-.25 5.5-.75M12 10v3.75m0 0-2.25 4.75M12 13.75l2.25 4.75' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <!-- Before first paint: the saved theme. The accessibility settings are
         applied in main.tsx, before React renders anything. -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
